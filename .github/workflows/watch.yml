name: kontenjan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kontenjan
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: durumu kaydet
        run: |
          git config user.name kontenjan-bot
          git config user.email kontenjan-bot@users.noreply.github.com
          git add state.txt
          git diff --cached --quiet || { git commit -m "kontenjan: $(cat state.txt)" && git push; }
